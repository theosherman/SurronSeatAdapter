<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD preview</title>
<style>
:root { color-scheme: light dark; font: 14px system-ui; }
body { margin: 0; height: 100vh; height: 100dvh; }
#toolbar {
    --surface: #19262f; --control: #23343f; --border: #40515e;
    position: absolute; z-index: 1; inset: 8px 8px auto;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    pointer-events: none; color-scheme: dark; color: #edf3f8;
}
#toolbar > *, #toolbar-actions > * { pointer-events: auto; }
#toolbar-actions { display: flex; gap: 4px; pointer-events: none; }
#toolbar select, #toolbar button, #toolbar summary, #toolbar-actions > label {
    box-sizing: border-box; min-height: 44px; padding: 0 9px; font: inherit;
    color: inherit; background: var(--control); border: 1px solid var(--border); border-radius: 8px;
}
#toolbar select { min-width: 0; font-size: 16px; }
#toolbar summary, #toolbar label { display: flex; align-items: center; gap: 6px; }
#toolbar summary { list-style: none; }
#toolbar summary::-webkit-details-marker { display: none; }
#toolbar input { accent-color: #9ce0dc; }
#view-panel {
    position: absolute; right: 0; top: 50px; box-sizing: border-box;
    width: min(100%, 300px); max-height: calc(100dvh - 66px); overflow: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px;
}
#parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 6px; }
#parts label { min-height: 44px; }
#toolbar label[hidden] { display: none; }
.view-actions { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 4px; }
#gestures { margin: 8px 2px 0; color: #c0ccd6; font-size: 12px; }
#status {
    position: absolute; top: 58px; left: 8px; max-width: calc(100% - 32px);
    padding: 6px 8px; border-radius: 6px; color: #edf3f8; background: #19262f;
}
canvas { display: block; width: 100%; height: 100%; min-height: 0; touch-action: none; cursor: grab; background: #14232e; }
canvas:active { cursor: grabbing; }
</style>
<header id="toolbar" aria-label="CAD preview controls">
<select id="variants" aria-label="Adapter variant">
<option value="adapter">Adapter</option>
<option value="split">Adapter Split</option>
</select>
<div id="toolbar-actions">
__EUC__
<details id="view-menu">
<summary>View <span aria-hidden="true">▾</span></summary>
<div id="view-panel">
<div id="parts" role="group" aria-label="Part visibility">__CONTROLS__</div>
<div class="view-actions">
<button id="closer" aria-label="Zoom in">+</button>
<button id="farther" aria-label="Zoom out">−</button>
<button id="reset">Reset view</button>
</div>
<p id="gestures"></p>
</div>
</details>
</div>
</header>
<div id="status" role="status">Loading parts…</div>
<canvas tabindex="0" aria-label="Interactive CAD preview. Pinch to zoom and drag with two fingers to pan. Right-drag to pan with a mouse. Arrow keys rotate and plus or minus zoom."></canvas>
__MESHES__
<script>
async function start() {
    const canvas = document.querySelector('canvas');
    const status = document.querySelector('#status');
    const gl = canvas.getContext('webgl2', {antialias: true});
    if (!gl) throw new Error('WebGL 2 is unavailable in this viewer.');

    function shader(type, source) {
        const object = gl.createShader(type);
        gl.shaderSource(object, source);
        gl.compileShader(object);
        if (!gl.getShaderParameter(object, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(object));
        return object;
    }
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, `#version 300 es
        in vec3 position;
        uniform mat3 view;
        uniform vec2 scale;
        uniform vec2 pan;
        out vec3 surface;
        void main() {
            surface = view * position;
            gl_Position = vec4(surface.xy * scale + pan, -surface.z * .5, 1.);
        }`));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `#version 300 es
        precision highp float;
        in vec3 surface;
        uniform vec3 partColor;
        out vec4 color;
        void main() {
            vec3 normal = normalize(cross(dFdx(surface), dFdy(surface)));
            float light = .38 + .62 * max(0., dot(normal, normalize(vec3(-.4,.7,1.))));
            color = vec4(partColor * light, 1.);
        }`));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    function upload(target, array) {
        gl.bindBuffer(target, gl.createBuffer());
        gl.bufferData(target, array, gl.STATIC_DRAW);
    }
    const attribute = gl.getAttribLocation(program, 'position');
    const picker = document.querySelector('#variants');
    const menu = document.querySelector('#view-menu');
    const toolbar = document.querySelector('#toolbar');
    const parts = [];
    for (const checkbox of toolbar.querySelectorAll('input[data-mesh]')) {
        const payload = document.getElementById(`mesh-${checkbox.dataset.mesh}`).textContent;
        const packed = Uint8Array.from(atob(payload), character => character.charCodeAt(0));
        const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
        const mesh = await new Response(stream).arrayBuffer();
        const count = new DataView(mesh).getUint32(0, true);
        const positions = new Float32Array(mesh, 4, count * 3);
        const indices = new Uint32Array(mesh, 4 + positions.byteLength);
        const vertexArray = gl.createVertexArray();
        gl.bindVertexArray(vertexArray);
        upload(gl.ARRAY_BUFFER, positions);
        gl.enableVertexAttribArray(attribute);
        gl.vertexAttribPointer(attribute, 3, gl.FLOAT, false, 0, 0);
        upload(gl.ELEMENT_ARRAY_BUFFER, indices);
        const color = [1, 3, 5].map(offset => parseInt(checkbox.dataset.color.slice(offset, offset + 2), 16) / 255);
        parts.push({checkbox, label: checkbox.parentElement, vertexArray, color, count: indices.length});
    }
    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(.078, .137, .18, 1);
    const view = gl.getUniformLocation(program, 'view');
    const scale = gl.getUniformLocation(program, 'scale');
    const pan = gl.getUniformLocation(program, 'pan');
    const partColor = gl.getUniformLocation(program, 'partColor');

    let yaw, pitch, zoom, panX, panY;
    const maxPitch = Math.PI / 2 - .005;
    function draw() {
        const ratio = Math.min(devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.round(canvas.clientWidth * ratio));
        const height = Math.max(1, Math.round(canvas.clientHeight * ratio));
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
        const aspect = canvas.width / canvas.height;
        const c = Math.cos(yaw), s = Math.sin(yaw);
        const h = Math.cos(pitch), v = Math.sin(pitch);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.uniformMatrix3fv(view, false, [c, -s*v, s*h, s, c*v, -c*h, 0, h, v]);
        gl.uniform2f(scale, zoom * Math.min(1, 1/aspect), zoom * Math.min(1, aspect));
        gl.uniform2f(pan, 2 * panX / Math.max(1, canvas.clientWidth),
                         -2 * panY / Math.max(1, canvas.clientHeight));
        for (const part of parts) {
            if (part.label.hidden || !part.checkbox.checked) continue;
            gl.bindVertexArray(part.vertexArray);
            gl.uniform3fv(partColor, part.color);
            gl.drawElements(gl.TRIANGLES, part.count, gl.UNSIGNED_INT, 0);
        }
    }
    function rotate(x, y) {
        yaw -= x * .009;
        pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch + y * .009));
        draw();
    }
    function boundedZoom(value) {
        return Math.min(8, Math.max(.25, value));
    }
    function magnify(factor) {
        zoom = boundedZoom(zoom * factor);
        draw();
    }
    function reset() {
        yaw = .95;
        pitch = .57;
        zoom = .91;
        panX = panY = 0;
        draw();
    }
    function selectVariant() {
        for (const {label} of parts) {
            label.hidden = !['both', picker.value].includes(label.dataset.variant);
        }
        draw();
    }
    picker.onchange = selectVariant;
    document.addEventListener('pointerdown', event => {
        if (menu.open && !menu.contains(event.target)) menu.open = false;
    });
    document.addEventListener('keydown', event => {
        if (event.key !== 'Escape' || !menu.open) return;
        menu.open = false;
        menu.querySelector('summary').focus();
    });
    const pointers = new Map();
    canvas.oncontextmenu = event => event.preventDefault();
    canvas.onpointerdown = event => {
        if (event.button !== 0 && event.button !== 2) return;
        const touch = event.pointerType === 'touch';
        const active = pointers.values().next().value;
        if (pointers.size >= 2 || (active && (!touch || !active.touch))) return;
        pointers.set(event.pointerId, {x: event.clientX, y: event.clientY, touch, pan: event.button === 2});
        canvas.setPointerCapture(event.pointerId);
    };
    canvas.onpointermove = event => {
        const pointer = pointers.get(event.pointerId);
        if (!pointer) return;
        const x = event.clientX, y = event.clientY;
        const {x: previousX, y: previousY} = pointer;
        const dx = x - previousX, dy = y - previousY;
        pointer.x = x;
        pointer.y = y;
        if (pointers.size === 2) {
            const [first, second] = pointers.values();
            const other = first === pointer ? second : first;
            const before = Math.max(1, Math.hypot(previousX - other.x, previousY - other.y));
            const after = Math.max(1, Math.hypot(x - other.x, y - other.y));
            const nextZoom = boundedZoom(zoom * after / before);
            const scaleChange = nextZoom / zoom - 1;
            const bounds = canvas.getBoundingClientRect();
            // Scale about the previous finger midpoint, then follow its movement.
            const anchorX = (previousX + other.x) / 2 - bounds.left - canvas.clientWidth / 2;
            const anchorY = (previousY + other.y) / 2 - bounds.top - canvas.clientHeight / 2;
            panX += (panX - anchorX) * scaleChange + dx / 2;
            panY += (panY - anchorY) * scaleChange + dy / 2;
            zoom = nextZoom;
        } else if (pointer.pan) {
            panX += dx;
            panY += dy;
        } else {
            rotate(dx, dy);
            return;
        }
        draw();
    };
    const endPointer = event => { pointers.delete(event.pointerId); };
    canvas.onpointerup = endPointer;
    canvas.onpointercancel = endPointer;
    canvas.onlostpointercapture = endPointer;
    canvas.addEventListener('wheel', event => {
        event.preventDefault();
        magnify(Math.exp(-event.deltaY * .0015));
    }, {passive: false});
    canvas.onkeydown = event => {
        const directions = {ArrowLeft: [-12, 0], ArrowRight: [12, 0], ArrowUp: [0, -12], ArrowDown: [0, 12]};
        if (directions[event.key]) rotate(...directions[event.key]);
        else if (event.key === '+' || event.key === '=') magnify(1.2);
        else if (event.key === '-') magnify(1 / 1.2);
        else return;
        event.preventDefault();
    };
    document.querySelector('#closer').onclick = () => magnify(1.2);
    document.querySelector('#farther').onclick = () => magnify(1 / 1.2);
    document.querySelector('#reset').onclick = reset;
    toolbar.addEventListener('change', event => {
        if (event.target.matches('input[data-mesh]')) draw();
    });
    new ResizeObserver(draw).observe(canvas);
    reset();
    const hasAdapter = parts.some(({label}) => label.dataset.variant === 'adapter');
    const hasSplit = parts.some(({label}) => label.dataset.variant === 'split');
    for (const option of picker.options) {
        option.disabled = option.value === 'adapter' ? !hasAdapter : !hasSplit;
    }
    picker.value = !hasAdapter && hasSplit ? 'split' : 'adapter';
    picker.disabled = !hasAdapter || !hasSplit;
    selectVariant();
    status.hidden = true;
    document.querySelector('#gestures').textContent = matchMedia('(pointer: coarse)').matches
        ? 'Drag to rotate · Two fingers to pan · Pinch to zoom'
        : 'Drag to rotate · Right-drag to pan · Scroll to zoom';
}
start().catch(error => { document.querySelector('#status').textContent = error.message; });
</script>
</html>
