name: Build and publish CAD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: cad-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install CAD dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Build printable CAD
        run: ./build.sh --stl
      - name: Validate printable CAD
        run: |
          python -m unittest discover -s tests
          node scripts/validate-mounting-ceilings.mjs
      - name: Package the release ZIP
        env:
          PYTHONPATH: .
        run: python .github/scripts/package_release.py
      - name: Upload CAD validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cad-validation
          path: logs/*.json
          if-no-files-found: ignore
      - name: Publish the commit's release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="cad-$GITHUB_SHA"
          asset=exports/SurronSeatAdapter.zip
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "$asset" --clobber
              gh release edit "$tag" --draft=false --latest
            else
              gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "${asset##*/}"
            fi
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --latest \
              --title "CAD build ${GITHUB_SHA:0:12}" \
              --notes "Validated CAD from commit $GITHUB_SHA. The ZIP contains printable STLs at its root, matching STEP files, and three PNG views per part."
          fi
      - name: Stage the CAD viewer
        run: install -D exports/preview.html "$RUNNER_TEMP/cad-pages/index.html"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/cad-pages

  deploy-preview:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy CAD viewer
        id: deployment
        uses: actions/deploy-pages@v4
