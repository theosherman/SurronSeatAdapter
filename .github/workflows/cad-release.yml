name: Build and publish CAD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: cad-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install CAD dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Build, validate, and package CAD
        run: scripts/build-release.sh
      - name: Publish the commit's release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="cad-$GITHUB_SHA"
          asset=exports/SurronSeatAdapter.zip
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "$asset" --clobber
              gh release edit "$tag" --draft=false --latest
            else
              gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "${asset##*/}"
            fi
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --latest \
              --title "CAD build ${GITHUB_SHA:0:12}" \
              --notes "Validated CAD from commit $GITHUB_SHA. The ZIP contains printable STLs at its root, matching STEP files, and three PNG views per part."
          fi
